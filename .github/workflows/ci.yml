name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "tensorflow>=2.16,<2.19" "numpy<2" scipy pandas matplotlib \
                      scikit-learn pytest ruff

      - name: Lint with ruff
        run: ruff check src scripts tests --output-format=github || true

      - name: Compile-check all modules
        run: python -m compileall -q src scripts tests

      - name: Run unit tests
        # Tests needing the dataset skip themselves when it is absent
        run: python -m pytest tests/ -v
